host: localhost:8080
info:
  contact: {}
  description: Backend API for DAPEN management of employee retirement funds
  title: DAPEN System API
  version: "1.0"
paths:
  /admin/activity-logs:
    get:
      description: Fetch a paginated list of activity logs
      parameters:
      - default: 1
        description: Page Number
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit per page
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Activity Logs
      tags:
      - Activity Log
  /admin/activity-logs/configs:
    get:
      description: Fetch all activity log configurations
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Activity Log Configs
      tags:
      - Activity Log
    post:
      consumes:
      - application/json
      description: Create or update an activity log configuration
      parameters:
      - description: Configuration Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_masza1_dapen-backend_internal_dto.SActivityLogConfigReq'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Save Activity Log Config
      tags:
      - Activity Log
  /admin/activity-logs/configs/{table_name}:
    get:
      description: Fetch activity log configuration for a specific table
      parameters:
      - description: Table Name
        in: path
        name: table_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Log Config by Table Name
      tags:
      - Activity Log
  /admin/database/tables:
    get:
      description: Fetch a list of all tables in the database for configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get All Database Tables
      tags:
      - Database
  /admin/database/tables/{table_name}/columns:
    get:
      description: Fetch a list of columns for a specific database table
      parameters:
      - description: Table Name
        in: path
        name: table_name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Columns for Table
      tags:
      - Database
  /admin/menu:
    get:
      description: Fetch a paginated list of all menus
      parameters:
      - default: 1
        description: Page Number
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit per page
        in: query
        name: limit
        type: integer
      - description: Search query
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get All Menus
      tags:
      - Menu
    post:
      consumes:
      - application/json
      description: Add a new menu item to the system
      parameters:
      - description: Menu Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_masza1_dapen-backend_internal_models.SDbMenu'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create New Menu
      tags:
      - Menu
  /admin/menu/{kode}:
    delete:
      description: Remove a menu item from the system
      parameters:
      - description: Menu Code
        in: path
        name: kode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete Menu
      tags:
      - Menu
    get:
      description: Fetch a single menu by its code
      parameters:
      - description: Menu Code
        in: path
        name: kode
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Menu By ID
      tags:
      - Menu
    put:
      consumes:
      - application/json
      description: Modify an existing menu item
      parameters:
      - description: Menu Code
        in: path
        name: kode
        required: true
        type: string
      - description: Updated Menu Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_masza1_dapen-backend_internal_models.SDbMenu'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update Menu
      tags:
      - Menu
  /admin/menu/parents:
    get:
      description: Fetch parent menus based on specific hierarchy level
      parameters:
      - description: Menu Level
        in: query
        name: level
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get Parent Menus
      tags:
      - Menu
  /api/admin/reports/permissions:
    get:
      description: |-
        Returns a matrix of users × menus × permissions. Supports JSON,
        Excel (.xlsx) and PDF output via the `format` query param.
        `userId` and `menuId` are optional filters; `menuType` selects
        between `menu` (dbmenu, default) and `report` (dbmenureport).
        The Excel and PDF responses are streamed and require at least
        one filter (userId or menuId) to avoid an OOM on the full matrix.
      parameters:
      - default: json
        description: Output format
        enum:
        - json
        - xlsx
        - pdf
        in: query
        name: format
        type: string
      - description: Filter by user ID
        in: query
        name: userId
        type: string
      - description: Filter by menu code
        in: query
        name: menuId
        type: string
      - default: menu
        description: menu or report
        enum:
        - menu
        - report
        in: query
        name: menuType
        type: string
      - default: 1
        description: Page Number
        in: query
        name: page
        type: integer
      - default: 50
        description: Per page
        in: query
        name: perPage
        type: integer
      produces:
      - application/json
      - application/octet-stream
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_masza1_dapen-backend_internal_dto.SPermissionReportResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Permission Report
      tags:
      - User
  /api/admin/settings/company:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_masza1_dapen-backend_internal_models.SDBPERUSAHAAN'
      summary: Get Company Settings
      tags:
      - Admin Settings
    put:
      consumes:
      - application/json
      parameters:
      - description: Company Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_masza1_dapen-backend_internal_models.SDBPERUSAHAAN'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update Company Settings
      tags:
      - Admin Settings
  /api/admin/settings/numbers:
    get:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_masza1_dapen-backend_internal_models.SDBNOMOR'
      summary: Get Numbering Settings
      tags:
      - Admin Settings
    put:
      consumes:
      - application/json
      parameters:
      - description: Numbering Data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_masza1_dapen-backend_internal_models.SDBNOMOR'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Update Numbering Settings
      tags:
      - Admin Settings
  /api/admin/users:
    get:
      description: Fetch a paginated list of legacy users from the DBFLPASS table
      parameters:
      - default: 1
        description: Page Number
        in: query
        name: page
        type: integer
      - default: 10
        description: Limit per page
        in: query
        name: limit
        type: integer
      - description: Search query
        in: query
        name: search
        type: string
      - description: Status filter
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Get Users
      tags:
      - User
    post:
      consumes:
      - application/json
      description: Hashing password and storing a new user record inside the DBFLPASS
        table
      parameters:
      - description: Create User Payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/github_com_masza1_dapen-backend_internal_dto.SCreateUserPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Create User
      tags:
      - User
  /api/admin/users/{id}:
    delete:
      description: Delete a user from the DBFLPASS table and prevent self-deletion
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      summary: Delete User
      tags:
      - User
    put:
      consumes:
      - application/json
      description: Update legacy fields for a user inside the DBFLPASS table
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      - description: Update User Payload
        in: body
