      description: Update the active periode for the user
      parameters:
      - description: Periode Data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/berkas.SetPeriodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Set Current Periode
      tags:
      - Berkas
  /customers:
