  github_com_masza1_dapen-backend_internal_dto.SUpdateUserPayload:
    properties:
      full_name:
        type: string
      password:
        description: 'optional: leave blank to keep unchanged'
        type: string
      role:
        enum:
        - admin
        - employee
        - karyawan
        type: string
      status:
        description: 'optional: "0" = inactive, "1" = active'
        type: string
    required:
