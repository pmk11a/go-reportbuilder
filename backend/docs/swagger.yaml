      field_name:
        type: string
      field_type:
        type: string
      is_sensitive:
        type: boolean
      is_tracked:
        type: boolean
      sort_order:
        type: integer
    required:
    - field_name
    type: object
  github_com_masza1_dapen-backend_internal_dto.SCreateUserPayload:
    properties:
      full_name:
        type: string
      password:
        minLength: 6
        type: string
      role:
        enum:
        - admin
        - employee
        - karyawan
        type: string
      username:
        minLength: 3
        type: string
    required:
    - full_name
    - password
    - role
    - username
    type: object
